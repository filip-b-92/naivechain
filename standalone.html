<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockchain Playground</title>
    <style>
        :root {
            --bg-dark: #0a0e27;
            --bg-card: #151a33;
            --accent-1: #00f2ff;
            --accent-2: #7b2ff7;
            --accent-3: #f72585;
            --text: #ffffff;
            --text-dim: #8892b0;
            --success: #00ff88;
            --warning: #ffaa00;
            --danger: #ff4466;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1f4d 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px;
            background: linear-gradient(135deg, var(--accent-2), var(--accent-1));
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 242, 255, 0.3);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--bg-card);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: var(--accent-1);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Settings */
        .setting {
            margin-bottom: 25px;
        }

        .setting label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--accent-2), var(--accent-1));
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent-1);
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-1);
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent-1);
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-1);
            border: none;
        }

        .slider-value {
            min-width: 60px;
            text-align: right;
            font-weight: bold;
            color: var(--accent-1);
            font-size: 1.1rem;
        }

        /* Buttons */
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: white;
            box-shadow: 0 4px 15px rgba(0, 242, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 255, 0.5);
        }

        .btn-success {
            background: var(--success);
            color: var(--bg-dark);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.5);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 68, 102, 0.5);
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .btn-icon {
            width: 30px;
            height: 30px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .action-buttons button {
            flex: 1;
        }

        /* Peers */
        .peers-container {
            display: grid;
            gap: 15px;
        }

        .peer {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            position: relative;
        }

        .peer.active {
            border-color: var(--accent-1);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
        }

        .peer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .peer-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-1);
        }

        .peer-stats {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        .mining-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-dim);
            margin-right: 5px;
        }

        .mining-indicator.active {
            background: var(--success);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Blockchain Viz */
        .blockchain-area {
            background: var(--bg-card);
            border-radius: 15px;
            padding: 20px;
            min-height: 400px;
        }

        .blockchain-scroll {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding: 20px 0;
        }

        .blockchain-scroll::-webkit-scrollbar {
            height: 8px;
        }

        .blockchain-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .blockchain-scroll::-webkit-scrollbar-thumb {
            background: var(--accent-1);
            border-radius: 10px;
        }

        .block {
            min-width: 180px;
            background: linear-gradient(135deg, rgba(123, 47, 247, 0.3), rgba(0, 242, 255, 0.3));
            border: 2px solid var(--accent-1);
            border-radius: 12px;
            padding: 15px;
            position: relative;
            animation: blockSlide 0.5s ease;
        }

        @keyframes blockSlide {
            from {
                opacity: 0;
                transform: translateX(-30px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        .block.genesis {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.3), rgba(0, 242, 255, 0.3));
            border-color: var(--success);
        }

        .block::after {
            content: '→';
            position: absolute;
            right: -20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.5rem;
            color: var(--accent-1);
        }

        .block:last-child::after {
            content: '';
        }

        .block-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-1);
            margin-bottom: 10px;
        }

        .block-info {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 5px;
        }

        .block-hash {
            font-family: monospace;
            font-size: 0.75rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px;
            border-radius: 5px;
            word-break: break-all;
            margin-top: 8px;
        }

        .block-miner {
            margin-top: 8px;
            padding: 4px 8px;
            background: rgba(0, 242, 255, 0.2);
            border-radius: 5px;
            font-size: 0.8rem;
            display: inline-block;
        }

        /* Network Canvas */
        .network-canvas {
            width: 100%;
            height: 300px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        /* Activity Feed */
        .activity-feed {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 15px;
        }

        .activity-feed::-webkit-scrollbar {
            width: 6px;
        }

        .activity-feed::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .activity-feed::-webkit-scrollbar-thumb {
            background: var(--accent-1);
            border-radius: 10px;
        }

        .activity-item {
            padding: 10px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border-left: 3px solid var(--accent-1);
            font-size: 0.9rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .activity-item.mining {
            border-left-color: var(--success);
        }

        .activity-item.sync {
            border-left-color: var(--accent-2);
        }

        .activity-time {
            color: var(--text-dim);
            font-size: 0.75rem;
            margin-right: 8px;
        }

        .hidden {
            display: none !important;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            margin-bottom: 10px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-1);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⛓️ Blockchain Playground</h1>
            <p class="subtitle">Interactive blockchain simulator - No setup required!</p>
        </header>

        <div class="main-grid">
            <!-- Settings Panel -->
            <aside>
                <div class="card">
                    <h2>⚙️ Settings</h2>

                    <div class="setting">
                        <label>Mining Speed</label>
                        <div class="slider-container">
                            <input type="range" id="miningSpeed" min="1" max="10" value="5" step="1">
                            <span class="slider-value" id="miningSpeedValue">5</span>
                        </div>
                    </div>

                    <div class="setting">
                        <label>Network Delay (ms)</label>
                        <div class="slider-container">
                            <input type="range" id="networkDelay" min="0" max="2000" value="500" step="100">
                            <span class="slider-value" id="networkDelayValue">500</span>
                        </div>
                    </div>

                    <div class="setting">
                        <label>Auto-Mine Interval (sec)</label>
                        <div class="slider-container">
                            <input type="range" id="autoInterval" min="1" max="10" value="3" step="1">
                            <span class="slider-value" id="autoIntervalValue">3</span>
                        </div>
                    </div>

                    <div class="action-buttons">
                        <button class="btn-success" id="autoMineBtn" onclick="toggleAutoMine()">
                            <span id="autoMineText">▶️ Auto</span>
                        </button>
                        <button class="btn-danger" onclick="resetPlayground()">🔄 Reset</button>
                    </div>
                </div>

                <div class="card" style="margin-top: 20px;">
                    <h2>👥 Peers</h2>
                    <button class="btn-primary" onclick="addPeer()" style="width: 100%; margin-bottom: 15px;">
                        + Add Peer
                    </button>
                    <div class="peers-container" id="peersContainer">
                        <!-- Peers will be added here -->
                    </div>
                </div>

                <div class="card" style="margin-top: 20px;">
                    <h2>📊 Stats</h2>
                    <div class="stats-grid">
                        <div class="stat">
                            <div class="stat-value" id="blockCount">1</div>
                            <div class="stat-label">Blocks</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value" id="peerCount">0</div>
                            <div class="stat-label">Peers</div>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Main Visualization Area -->
            <main>
                <!-- Blockchain -->
                <div class="card">
                    <h2>⛓️ Blockchain</h2>
                    <div class="blockchain-scroll" id="blockchain">
                        <!-- Blocks will be added here -->
                    </div>
                </div>

                <!-- Network Visualization -->
                <div class="card" style="margin-top: 20px;">
                    <h2>🌐 Network</h2>
                    <canvas id="networkCanvas" class="network-canvas"></canvas>
                </div>

                <!-- Manual Mining -->
                <div class="card" style="margin-top: 20px;">
                    <h2>⛏️ Manual Mining</h2>
                    <input type="text" id="blockData" placeholder="Enter block data..." onkeypress="if(event.key==='Enter') mineManualBlock()">
                    <button class="btn-primary" onclick="mineManualBlock()" style="width: 100%;">
                        ⛏️ Mine Block
                    </button>
                </div>

                <!-- Activity Feed -->
                <div class="card" style="margin-top: 20px;">
                    <h2>📋 Activity</h2>
                    <div class="activity-feed" id="activityFeed">
                        <div class="activity-item">
                            <span class="activity-time">[00:00:00]</span>
                            Playground initialized!
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        // ============================================
        // BLOCKCHAIN CORE
        // ============================================

        class Block {
            constructor(index, previousHash, timestamp, data, hash, minedBy = null) {
                this.index = index;
                this.previousHash = previousHash;
                this.timestamp = timestamp;
                this.data = data;
                this.hash = hash;
                this.minedBy = minedBy;
            }
        }

        class Blockchain {
            constructor() {
                this.chain = [this.createGenesisBlock()];
            }

            createGenesisBlock() {
                return new Block(0, "0", Date.now(), "Genesis Block", "0000genesis", "System");
            }

            async calculateHash(index, previousHash, timestamp, data) {
                const text = `${index}${previousHash}${timestamp}${data}`;
                const msgBuffer = new TextEncoder().encode(text);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }

            async generateBlock(data, minedBy) {
                const previousBlock = this.chain[this.chain.length - 1];
                const index = previousBlock.index + 1;
                const timestamp = Date.now();
                const hash = await this.calculateHash(index, previousBlock.hash, timestamp, data);
                return new Block(index, previousBlock.hash, timestamp, data, hash, minedBy);
            }

            addBlock(block) {
                this.chain.push(block);
            }
        }

        // ============================================
        // PEER SYSTEM
        // ============================================

        class Peer {
            constructor(id, name) {
                this.id = id;
                this.name = name;
                this.hashPower = 5; // 1-10 scale
                this.blockchain = new Blockchain();
                this.isMining = false;
                this.blocksMinedCount = 0;
            }

            async mine(data) {
                this.isMining = true;
                updatePeerUI();

                // Simulate mining time based on hash power (higher = faster)
                const miningTime = (11 - this.hashPower) * 200;
                await sleep(miningTime);

                const block = await this.blockchain.generateBlock(data, this.name);
                this.blockchain.addBlock(block);
                this.blocksMinedCount++;
                this.isMining = false;

                addActivity(`${this.name} mined block #${block.index}`, 'mining');

                // Broadcast to network
                await broadcastBlock(block, this.id);

                updatePeerUI();
                return block;
            }

            async receiveBlock(block) {
                // Simulate network delay
                const delay = parseInt(document.getElementById('networkDelay').value);
                await sleep(delay);

                // Only add if we don't have it
                if (block.index >= this.blockchain.chain.length) {
                    this.blockchain.addBlock(block);
                    addActivity(`${this.name} received block #${block.index}`, 'sync');
                }
            }
        }

        // ============================================
        // STATE
        // ============================================

        let peers = [];
        let peerIdCounter = 0;
        let globalBlockchain = new Blockchain();
        let autoMining = false;
        let autoMiningInterval = null;

        // ============================================
        // PEER MANAGEMENT
        // ============================================

        function addPeer() {
            const id = peerIdCounter++;
            const name = `Peer ${id + 1}`;
            const peer = new Peer(id, name);
            peers.push(peer);

            updatePeerUI();
            updateStats();
            drawNetwork();
            addActivity(`${name} joined the network`, 'sync');
        }

        function removePeer(id) {
            peers = peers.filter(p => p.id !== id);
            updatePeerUI();
            updateStats();
            drawNetwork();
            addActivity(`Peer removed from network`, 'sync');
        }

        function updatePeerHashPower(id, value) {
            const peer = peers.find(p => p.id === id);
            if (peer) {
                peer.hashPower = parseInt(value);
                updatePeerUI();
            }
        }

        function updatePeerUI() {
            const container = document.getElementById('peersContainer');

            if (peers.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-dim); padding: 20px;">No peers yet. Click "Add Peer" to start!</div>';
                return;
            }

            container.innerHTML = '';
            peers.forEach(peer => {
                const peerEl = document.createElement('div');
                peerEl.className = `peer ${peer.isMining ? 'active' : ''}`;
                peerEl.innerHTML = `
                    <div class="peer-header">
                        <div class="peer-name">${peer.name}</div>
                        <button class="btn-danger btn-icon btn-small" onclick="removePeer(${peer.id})">×</button>
                    </div>
                    <div class="peer-stats">
                        <span class="mining-indicator ${peer.isMining ? 'active' : ''}"></span>
                        ${peer.isMining ? 'Mining...' : 'Idle'} | Blocks: ${peer.blocksMinedCount}
                    </div>
                    <div class="setting">
                        <label>Hash Power: <span id="hashPower${peer.id}">${peer.hashPower}</span></label>
                        <input type="range" min="1" max="10" value="${peer.hashPower}" step="1"
                               oninput="updatePeerHashPower(${peer.id}, this.value); document.getElementById('hashPower${peer.id}').textContent = this.value"
                               style="width: 100%;">
                    </div>
                `;
                container.appendChild(peerEl);
            });
        }

        // ============================================
        // MINING
        // ============================================

        async function mineManualBlock() {
            const dataInput = document.getElementById('blockData');
            const data = dataInput.value.trim() || 'Manual block';

            if (peers.length === 0) {
                addActivity('Add peers first!', 'mining');
                return;
            }

            // Random peer mines
            const randomPeer = peers[Math.floor(Math.random() * peers.length)];
            await randomPeer.mine(data);

            // Update global blockchain
            syncGlobalBlockchain();

            dataInput.value = '';
            updateUI();
        }

        async function autoMine() {
            if (peers.length === 0) return;

            // Weighted random selection based on hash power
            const totalHashPower = peers.reduce((sum, p) => sum + p.hashPower, 0);
            let random = Math.random() * totalHashPower;
            let selectedPeer = peers[0];

            for (const peer of peers) {
                random -= peer.hashPower;
                if (random <= 0) {
                    selectedPeer = peer;
                    break;
                }
            }

            const data = `Auto-block ${Date.now()}`;
            await selectedPeer.mine(data);

            syncGlobalBlockchain();
            updateUI();
        }

        function toggleAutoMine() {
            autoMining = !autoMining;
            const btn = document.getElementById('autoMineBtn');
            const text = document.getElementById('autoMineText');

            if (autoMining) {
                btn.className = 'btn-danger';
                text.textContent = '⏹️ Stop';

                const interval = parseInt(document.getElementById('autoInterval').value) * 1000;
                autoMiningInterval = setInterval(autoMine, interval);

                addActivity('Auto-mining started', 'mining');
            } else {
                btn.className = 'btn-success';
                text.textContent = '▶️ Auto';

                if (autoMiningInterval) {
                    clearInterval(autoMiningInterval);
                }

                addActivity('Auto-mining stopped', 'mining');
            }
        }

        // ============================================
        // BLOCKCHAIN SYNC
        // ============================================

        async function broadcastBlock(block, sourcePeerId) {
            // Broadcast to all other peers
            for (const peer of peers) {
                if (peer.id !== sourcePeerId) {
                    await peer.receiveBlock(block);
                }
            }
        }

        function syncGlobalBlockchain() {
            // Find longest chain among all peers
            let longestChain = [];
            for (const peer of peers) {
                if (peer.blockchain.chain.length > longestChain.length) {
                    longestChain = peer.blockchain.chain;
                }
            }

            globalBlockchain.chain = longestChain.length > 0 ? longestChain : globalBlockchain.chain;
        }

        // ============================================
        // UI UPDATES
        // ============================================

        function updateUI() {
            updateBlockchainViz();
            updateStats();
            drawNetwork();
        }

        function updateBlockchainViz() {
            const container = document.getElementById('blockchain');
            container.innerHTML = '';

            globalBlockchain.chain.forEach((block, index) => {
                const blockEl = document.createElement('div');
                blockEl.className = `block ${index === 0 ? 'genesis' : ''}`;

                const time = new Date(block.timestamp).toLocaleTimeString();

                blockEl.innerHTML = `
                    <div class="block-number">#${block.index}</div>
                    <div class="block-info">⏰ ${time}</div>
                    <div class="block-info">📦 ${truncate(block.data, 20)}</div>
                    <div class="block-hash">${truncate(block.hash, 12)}</div>
                    ${block.minedBy ? `<div class="block-miner">⛏️ ${block.minedBy}</div>` : ''}
                `;
                container.appendChild(blockEl);
            });

            container.scrollLeft = container.scrollWidth;
        }

        function updateStats() {
            document.getElementById('blockCount').textContent = globalBlockchain.chain.length;
            document.getElementById('peerCount').textContent = peers.length;
        }

        function drawNetwork() {
            const canvas = document.getElementById('networkCanvas');
            const ctx = canvas.getContext('2d');

            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (peers.length === 0) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Add peers to see network', canvas.width / 2, canvas.height / 2);
                return;
            }

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(canvas.width, canvas.height) / 3;

            // Calculate positions
            const positions = peers.map((peer, i) => {
                if (peers.length === 1) {
                    return { x: centerX, y: centerY };
                }
                const angle = (i * 2 * Math.PI / peers.length) - Math.PI / 2;
                return {
                    x: centerX + radius * Math.cos(angle),
                    y: centerY + radius * Math.sin(angle)
                };
            });

            // Draw connections (mesh network)
            peers.forEach((peer1, i) => {
                peers.forEach((peer2, j) => {
                    if (i < j) {
                        ctx.beginPath();
                        ctx.moveTo(positions[i].x, positions[i].y);
                        ctx.lineTo(positions[j].x, positions[j].y);
                        ctx.strokeStyle = 'rgba(0, 242, 255, 0.3)';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                });
            });

            // Draw nodes
            positions.forEach((pos, i) => {
                const peer = peers[i];
                const nodeRadius = 30 + (peer.hashPower * 2);

                // Glow if mining
                if (peer.isMining) {
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, nodeRadius + 10, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(0, 255, 136, 0.2)';
                    ctx.fill();
                }

                // Node circle
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, nodeRadius, 0, Math.PI * 2);
                ctx.fillStyle = peer.isMining ? '#00ff88' : '#00f2ff';
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Label
                ctx.fillStyle = '#0a0e27';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(peer.name.replace('Peer ', 'P'), pos.x, pos.y);

                // Hash power indicator
                ctx.fillStyle = '#ffffff';
                ctx.font = '10px Arial';
                ctx.fillText(`⚡${peer.hashPower}`, pos.x, pos.y + nodeRadius + 15);
            });
        }

        function addActivity(message, type = '') {
            const feed = document.getElementById('activityFeed');
            const time = new Date().toLocaleTimeString();

            const item = document.createElement('div');
            item.className = `activity-item ${type}`;
            item.innerHTML = `<span class="activity-time">[${time}]</span>${message}`;

            feed.insertBefore(item, feed.firstChild);

            // Limit to 50 items
            while (feed.children.length > 50) {
                feed.removeChild(feed.lastChild);
            }
        }

        // ============================================
        // CONTROLS
        // ============================================

        function resetPlayground() {
            if (!confirm('Reset everything?')) return;

            // Stop auto mining
            if (autoMining) toggleAutoMine();

            // Reset state
            peers = [];
            peerIdCounter = 0;
            globalBlockchain = new Blockchain();

            // Reset UI
            updatePeerUI();
            updateUI();

            document.getElementById('activityFeed').innerHTML = `
                <div class="activity-item">
                    <span class="activity-time">[${new Date().toLocaleTimeString()}]</span>
                    Playground reset!
                </div>
            `;
        }

        // ============================================
        // UTILITIES
        // ============================================

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function truncate(str, len) {
            return str.length > len ? str.substring(0, len) + '...' : str;
        }

        // ============================================
        // INITIALIZATION
        // ============================================

        // Update slider values
        document.getElementById('miningSpeed').oninput = function() {
            document.getElementById('miningSpeedValue').textContent = this.value;
        };

        document.getElementById('networkDelay').oninput = function() {
            document.getElementById('networkDelayValue').textContent = this.value;
        };

        document.getElementById('autoInterval').oninput = function() {
            document.getElementById('autoIntervalValue').textContent = this.value;

            // Update interval if auto-mining is active
            if (autoMining) {
                clearInterval(autoMiningInterval);
                const interval = parseInt(this.value) * 1000;
                autoMiningInterval = setInterval(autoMine, interval);
            }
        };

        // Initial setup
        window.onload = () => {
            updateUI();
            addActivity('Welcome to Blockchain Playground! Add peers to get started.', 'sync');

            // Redraw network on resize
            window.onresize = drawNetwork;
        };
    </script>
</body>
</html>
